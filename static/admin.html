<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Praisehub</title>
    <link rel="icon" type="image/x-icon" href="/static/icon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Loading Spinner Overlay -->
    <div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1000;background:rgba(255,255,255,0.7);align-items:center;justify-content:center;" class="flex">
        <div class="flex flex-col items-center">
            <svg class="animate-spin h-12 w-12 text-blue-600 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            <span class="text-blue-700 font-semibold text-lg">Loading...</span>
        </div>
    </div>
    <div class="flex-1 flex flex-col items-center justify-center">
        <!-- Top Navigation (Tabs) -->
        <div class="fixed top-0 left-0 w-full flex justify-center bg-white shadow z-10">
            <div class="w-full max-w-2xl flex rounded-b-lg overflow-hidden">
                <button id="tabUser" class="flex-1 py-3 text-lg font-semibold bg-blue-600 text-white hover:bg-blue-700 transition" type="button">User Management</button>
                <button id="tabBible" class="flex-1 py-3 text-lg font-semibold bg-blue-100 text-blue-700 hover:bg-blue-200 transition" type="button">Bible Management</button>
            </div>
        </div>
        <div class="w-full h-16"></div> <!-- Spacer for fixed nav -->
        <!-- User Management Section -->
        <div id="userSection" class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-2xl p-8 border border-blue-100">
            <h2 class="text-2xl font-extrabold mb-6 text-blue-700 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                User Management
            </h2>
            <form id="userForm" class="space-y-4 mb-6 bg-blue-50 rounded-lg p-4 shadow">
                <input type="hidden" id="userId">
                <div class="flex gap-2">
                    <input type="text" id="firstname" placeholder="First Name" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <input type="text" id="lastname" placeholder="Last Name" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div class="flex gap-2">
                    <input type="text" id="username" placeholder="Username" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div class="flex gap-2">
                    <input type="text" id="orgname" placeholder="Organization" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <input type="text" id="mobile" placeholder="Mobile" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div class="flex gap-2 items-center">
                    <input type="password" id="password" placeholder="Password" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <input type="checkbox" id="isEmailVerified" class="ml-2"> <label for="isEmailVerified" class="ml-1">Email Verified</label>
                    <input type="checkbox" id="isRegistered" class="ml-2"> <label for="isRegistered" class="ml-1">Registered</label>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded shadow hover:bg-blue-700 transition duration-150 font-semibold">Save</button>
                    <button type="button" id="resetBtn" class="bg-gray-300 text-gray-800 px-5 py-2 rounded shadow hover:bg-gray-400 transition duration-150 font-semibold">Reset</button>
                </div>
            </form>
            <div class="overflow-x-auto rounded-lg border border-gray-200 bg-white">
                <table class="min-w-full text-sm text-left">
                    <thead>
                        <tr class="bg-blue-100 text-blue-800">
                            <th class="px-3 py-2">ID</th>
                            <th class="px-3 py-2">First</th>
                            <th class="px-3 py-2">Last</th>
                            <th class="px-3 py-2">Username</th>
                            <th class="px-3 py-2">Email</th>
                            <th class="px-3 py-2">Org</th>
                            <th class="px-3 py-2">Mobile</th>
                            <th class="px-3 py-2">Verified</th>
                            <th class="px-3 py-2">Registered</th>
                            <th class="px-3 py-2">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTbody"></tbody>
                </table>
            </div>
            <div id="crudMsg" class="text-center mt-4 min-h-[24px] text-red-600 font-medium"></div>
        </div>
        <!-- Bible Management Section -->
        <div id="bibleSection" class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-2xl p-8 border border-green-100" style="display:none;">
            <h2 class="text-2xl font-extrabold mb-6 text-green-700 flex items-center gap-2">
                <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                Bible Management
            </h2>
            <form id="bibleUploadForm" class="flex flex-col gap-4 mb-8 bg-green-50 p-4 rounded-lg shadow" enctype="multipart/form-data">
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-green-700">Bible Name:</label>
                    <input type="text" id="bibleName" placeholder="Enter Bible Name (e.g. American Standard Version)" class="border rounded px-2 py-1" required>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-green-700">Abbreviation:</label>
                    <input type="text" id="bibleAbbr" placeholder="e.g. ASV" class="border rounded px-2 py-1">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-green-700">Upload Bible DB:</label>
                    <input type="file" id="bibleFile" accept=".sqlite3,.SQLite3" class="border rounded px-2 py-1" required>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-green-700">Year:</label>
                    <input type="text" id="bibleYear" placeholder="e.g. 1901" class="border rounded px-2 py-1">
                </div>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 transition font-semibold">Upload</button>
                <span id="uploadMsg" class="ml-2 text-sm"></span>
            </form>
            <!-- Bible List Table -->
            <div class="flex flex-col gap-2 mb-2">
                <input type="text" id="bibleSearch" placeholder="Search Bible..." class="border rounded px-2 py-1 w-full" />
            </div>
            <div class="flex gap-2 mb-4">
                <button class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 transition font-semibold" onclick="downloadAllBibles()">📥 Download All Bibles</button>
            </div>
            <div class="overflow-x-auto max-h-64 overflow-y-auto rounded-lg border border-gray-200 bg-white mb-6">
                <table class="min-w-full text-sm text-left">
                    <thead>
                        <tr class="bg-green-100 text-green-800 sticky top-0 z-10">
                            <th class="px-3 py-2 cursor-pointer" id="sortBibleName">Bible Name</th>
                            <th class="px-3 py-2 cursor-pointer" id="sortBibleAbbr">Abbreviation</th>
                            <th class="px-3 py-2 cursor-pointer" id="sortBibleLang">Language</th>
                            <th class="px-3 py-2 cursor-pointer" id="sortBibleYear">Year</th>
                            <th class="px-3 py-2">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="biblesTbody"></tbody>
                </table>
            </div>
            <!-- Delete Confirmation Modal -->
            <div id="deleteBibleModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50" style="display:none;">
                <div class="bg-white rounded-lg shadow-lg p-6 max-w-sm w-full">
                    <h3 class="text-lg font-bold mb-4 text-red-700">Delete Bible</h3>
                    <p class="mb-4">Are you sure you want to delete <span id="deleteBibleName" class="font-semibold"></span>?</p>
                    <div class="flex gap-2 justify-end">
                        <button id="confirmDeleteBible" class="bg-red-600 text-white px-4 py-1 rounded hover:bg-red-700">Delete</button>
                        <button id="cancelDeleteBible" class="bg-gray-300 text-gray-800 px-4 py-1 rounded hover:bg-gray-400">Cancel</button>
                    </div>
                    <span id="deleteBibleMsg" class="ml-2 text-sm"></span>
                </div>
            </div>
            <!-- Bible Rename Form -->
            <form id="bibleRenameForm" class="flex flex-col gap-2 mb-4 bg-green-50 p-4 rounded-lg shadow" style="display:none;">
                <label class="font-semibold text-green-700">Bible Name:</label>
                <input type="text" id="editBibleName" class="border rounded px-2 py-1" required>
                <label class="font-semibold text-green-700">Abbreviation:</label>
                <input type="text" id="editBibleAbbr" class="border rounded px-2 py-1">
                <label class="font-semibold text-green-700">Year:</label>
                <input type="text" id="editBibleYear" class="border rounded px-2 py-1">
                <label class="font-semibold text-green-700">Update Bible DB (optional):</label>
                <input type="file" id="editBibleFile" accept=".sqlite3,.SQLite3" class="border rounded px-2 py-1">
                <input type="hidden" id="editBibleOldName">
                <div class="flex gap-2">
                    <button type="submit" class="bg-green-600 text-white px-4 py-1 rounded shadow hover:bg-green-700 transition font-semibold">Save</button>
                    <button type="button" id="cancelEditBible" class="bg-gray-300 text-gray-800 px-4 py-1 rounded shadow hover:bg-gray-400 transition font-semibold">Cancel</button>
                </div>
                <span id="renameMsg" class="ml-2 text-sm"></span>
            </form>
        </div>
    </div>
    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col items-end space-y-2"></div>
    <!-- User Delete Confirmation Modal -->
    <div id="deleteUserModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50" style="display:none;">
        <div class="bg-white rounded-lg shadow-lg p-6 max-w-sm w-full">
            <h3 class="text-lg font-bold mb-4 text-red-700">Delete User</h3>
            <p class="mb-4">Are you sure you want to delete user <span id="deleteUserName" class="font-semibold"></span>?</p>
            <div class="flex gap-2 justify-end">
                <button id="confirmDeleteUser" class="bg-red-600 text-white px-4 py-1 rounded hover:bg-red-700">Delete</button>
                <button id="cancelDeleteUser" class="bg-gray-300 text-gray-800 px-4 py-1 rounded hover:bg-gray-400">Cancel</button>
            </div>
            <span id="deleteUserMsg" class="ml-2 text-sm"></span>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Tab switching logic
        const tabUser = document.getElementById('tabUser');
        const tabBible = document.getElementById('tabBible');
        const userSection = document.getElementById('userSection');
        const bibleSection = document.getElementById('bibleSection');
        tabUser.onclick = function() {
            tabUser.className = 'flex-1 py-3 text-lg font-semibold bg-blue-600 text-white hover:bg-blue-700 transition';
            tabBible.className = 'flex-1 py-3 text-lg font-semibold bg-blue-100 text-blue-700 hover:bg-blue-200 transition';
            userSection.style.display = '';
            bibleSection.style.display = 'none';
        };
        tabBible.onclick = function() {
            tabBible.className = 'flex-1 py-3 text-lg font-semibold bg-green-600 text-white hover:bg-green-700 transition';
            tabUser.className = 'flex-1 py-3 text-lg font-semibold bg-blue-100 text-blue-700 hover:bg-blue-200 transition';
            userSection.style.display = 'none';
            bibleSection.style.display = '';
        };
        // Default to User tab
        tabUser.click();
        // Toast function
        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.createElement('div');
            let color = 'bg-blue-600';
            if (type === 'success') color = 'bg-green-600';
            if (type === 'error') color = 'bg-red-600';
            toast.className = `${color} text-white px-6 py-3 rounded shadow-lg font-semibold text-center relative flex items-center gap-2`;
            toast.innerHTML = `
                <span class="flex-1">${message}</span>
                <button class="ml-4 text-white text-xl font-bold focus:outline-none hover:text-gray-200" style="line-height:1;" aria-label="Close">&times;</button>
            `;
            const closeBtn = toast.querySelector('button');
            closeBtn.onclick = () => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            };
            document.getElementById('toastContainer').appendChild(toast);
            if (type !== 'error') {
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                    setTimeout(() => toast.remove(), 500);
                }, duration);
            }
        }
        // Spinner helpers
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
        // User CRUD JS
        function fetchUsers() {
            showLoading();
            fetch('/api/users')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('usersTbody');
                    tbody.innerHTML = '';
                    (data.users || []).forEach(user => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-blue-50 transition';
                        tr.innerHTML = `
                            <td class="px-3 py-2">${user.id}</td>
                            <td class="px-3 py-2">${user.firstname}</td>
                            <td class="px-3 py-2">${user.lastname}</td>
                            <td class="px-3 py-2">${user.username}</td>
                            <td class="px-3 py-2">${user.email}</td>
                            <td class="px-3 py-2">${user.orgname || ''}</td>
                            <td class="px-3 py-2">${user.mobile || ''}</td>
                            <td class="px-3 py-2 text-center">${user.isEmailVerified ? '✔️' : ''}</td>
                            <td class="px-3 py-2 text-center">${user.isRegistered ? '✔️' : ''}</td>
                            <td class="px-3 py-2 flex gap-2">
                                <button onclick="editUser(${user.id})" class="text-blue-600 hover:underline" title="Edit User">✏️</button>
                                <button onclick="showDeleteUser(${user.id})" class="text-red-600 hover:underline" title="Delete User">🗑️</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(() => {
                    hideLoading();
                })
                .finally(() => {
                    hideLoading();
                });
        }
        function editUser(id) {
            showLoading();
            fetch('/api/users')
                .then(res => res.json())
                .then(data => {
                    const user = (data.users || []).find(u => u.id === id);
                    if (!user) return;
                    document.getElementById('userId').value = user.id;
                    document.getElementById('firstname').value = user.firstname;
                    document.getElementById('lastname').value = user.lastname;
                    document.getElementById('username').value = user.username;
                    document.getElementById('email').value = user.email;
                    document.getElementById('orgname').value = user.orgname || '';
                    document.getElementById('mobile').value = user.mobile || '';
                    document.getElementById('isEmailVerified').checked = !!user.isEmailVerified;
                    document.getElementById('isRegistered').checked = !!user.isRegistered;
                    document.getElementById('password').value = '';
                })
                .catch(() => {
                    hideLoading();
                })
                .finally(() => {
                    hideLoading();
                });
        }
        window.editUser = editUser;
        document.getElementById('userForm').onsubmit = function(e) {
            e.preventDefault();
            showLoading();
            const id = document.getElementById('userId').value;
            const firstname = document.getElementById('firstname').value;
            const lastname = document.getElementById('lastname').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const orgname = document.getElementById('orgname').value;
            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;
            const isEmailVerified = document.getElementById('isEmailVerified').checked ? 1 : 0;
            const isRegistered = document.getElementById('isRegistered').checked ? 1 : 0;
            const payload = { id, firstname, lastname, username, email, orgname, mobile, isEmailVerified, isRegistered };
            if (password) payload.password = password;
            const method = id ? 'PUT' : 'POST';
            fetch('/api/users', {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then (result => {
                if (result.success) {
                    showToast(id ? 'User updated.' : 'User created.', 'success');
                    document.getElementById('userForm').reset();
                    document.getElementById('userId').value = '';
                } else {
                    showToast(result.error || 'Operation failed.', 'error');
                }
                fetchUsers();
            })
            .catch(() => {
                hideLoading();
            })
            .finally(() => {
                hideLoading();
            });
        };
        document.getElementById('resetBtn').onclick = function() {
            showLoading();
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            showToast('Form reset.', 'info');
            hideLoading();
        };
        function showDeleteUser(id) {
            showLoading();
            fetch('/api/users')
                .then(res => res.json())
                .then(data => {
                    const user = (data.users || []).find(u => u.id === id);
                    if (!user) return;
                    document.getElementById('deleteUserModal').style.display = '';
                    document.getElementById('deleteUserName').textContent = user.username || user.email || user.id;
                    document.getElementById('confirmDeleteUser').setAttribute('data-user', id);
                    document.getElementById('deleteUserMsg').textContent = '';
                })
                .catch(() => {
                    hideLoading();
                })
                .finally(() => {
                    hideLoading();
                });
        }
        window.showDeleteUser = showDeleteUser;
        document.getElementById('cancelDeleteUser').onclick = function() {
            document.getElementById('deleteUserModal').style.display = 'none';
            document.getElementById('deleteUserMsg').textContent = '';
        };
        document.getElementById('confirmDeleteUser').onclick = function() {
            showLoading();
            const id = this.getAttribute('data-user');
            fetch('/api/users', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast('User deleted.', 'success');
                    setTimeout(() => {
                        document.getElementById('deleteUserModal').style.display = 'none';
                        fetchUsers();
                    }, 700);
                } else {
                    showToast(result.error || 'Delete failed.', 'error');
                }
            })
            .catch(() => {
                hideLoading();
            })
            .finally(() => {
                hideLoading();
            });
        };
        // Bible DB Upload JS
        const bibleUploadForm = document.getElementById('bibleUploadForm');
        const bibleFile = document.getElementById('bibleFile');
        const bibleName = document.getElementById('bibleName');
        const uploadMsg = document.getElementById('uploadMsg');
        bibleUploadForm.onsubmit = function(e) {
            e.preventDefault();
            showLoading();
            uploadMsg.textContent = '';
            const file = bibleFile.files[0];
            const name = bibleName.value.trim();
            const abbr = document.getElementById('bibleAbbr').value.trim();
            const year = document.getElementById('bibleYear').value.trim();
            if (!file || !name) {
                showToast('Please provide a Bible name and select a file.', 'error');
                hideLoading();
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            formData.append('name', name);
            formData.append('abbreviation', abbr);
            formData.append('year', year);
            fetch('/api/upload-bible', {
                method: 'POST',
                body: formData
            })
            .then(res => {
                hideLoading();
                if (!res.ok) {
                    showToast('Server error: ' + res.status, 'error');
                    return Promise.reject();
                }
                return res.json();
            })
            .then(result => {
                if (result && result.success) {
                    showToast('Upload successful!', 'success');
                    bibleFile.value = '';
                    bibleName.value = '';
                    document.getElementById('bibleAbbr').value = '';
                    document.getElementById('bibleYear').value = '';
                    setTimeout(fetchBibles, 300); // Delay to allow spinner to hide
                } else if (result) {
                    showToast(result.error || 'Upload failed.', 'error');
                }
            })
            .catch(() => {
                hideLoading();
            })
            .finally(() => {
                // hideLoading(); // Already called above
            });
        };
        // Bible List and Rename JS
        let bibleList = [];
        let bibleSortKey = 'name';
        let bibleSortAsc = true;
        function fetchBibles() {
            showLoading();
            fetch('/api/translations')
                .then(res => res.json())
                .then(data => {
                    bibleList = data.translations || [];
                    renderBibleTable();
                })
                .catch(() => {
                    hideLoading();
                })
                .finally(() => {
                    hideLoading();
                });
        }
        function renderBibleTable() {
            const search = document.getElementById('bibleSearch').value.trim().toLowerCase();
            let filtered = bibleList.filter(bible =>
                bible.name.toLowerCase().includes(search) ||
                (bible.abbreviation || '').toLowerCase().includes(search) ||
                (bible.language || '').toLowerCase().includes(search) ||
                (bible.year || '').toLowerCase().includes(search)
            );
            filtered.sort((a, b) => {
                let valA = (a[bibleSortKey] || '').toLowerCase();
                let valB = (b[bibleSortKey] || '').toLowerCase();
                if (valA < valB) return bibleSortAsc ? -1 : 1;
                if (valA > valB) return bibleSortAsc ? 1 : -1;
                return 0;
            });
            const tbody = document.getElementById('biblesTbody');
            tbody.innerHTML = '';
            filtered.forEach(bible => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-green-50 transition';
                tr.innerHTML = `
                    <td class="px-3 py-2">${bible.name}</td>
                    <td class="px-3 py-2">${bible.abbreviation || ''}</td>
                    <td class="px-3 py-2">${bible.language || ''}</td>
                    <td class="px-3 py-2">${bible.year || ''}</td>
                    <td class="px-3 py-2 flex gap-2">
                        <button class="text-green-700 hover:underline" onclick="showRenameBible('${bible.name.replace(/'/g, "\\'")}', '${bible.abbreviation ? bible.abbreviation.replace(/'/g, "\\'") : ''}')">Edit</button>
                        <button class="text-red-700 hover:underline" onclick="showDeleteBible('${bible.name.replace(/'/g, "\\'")}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        document.getElementById('bibleSearch').addEventListener('input', renderBibleTable);
        document.getElementById('sortBibleName').onclick = function() {
            bibleSortKey = 'name';
            bibleSortAsc = bibleSortKey === 'name' ? !bibleSortAsc : true;
            renderBibleTable();
        };
        document.getElementById('sortBibleAbbr').onclick = function() {
            bibleSortKey = 'abbreviation';
            bibleSortAsc = bibleSortKey === 'abbreviation' ? !bibleSortAsc : true;
            renderBibleTable();
        };
        document.getElementById('sortBibleLang').onclick = function() {
            bibleSortKey = 'language';
            bibleSortAsc = bibleSortKey === 'language' ? !bibleSortAsc : true;
            renderBibleTable();
        };
        document.getElementById('sortBibleYear').onclick = function() {
            bibleSortKey = 'year';
            bibleSortAsc = bibleSortKey === 'year' ? !bibleSortAsc : true;
            renderBibleTable();
        };
        window.showRenameBible = function(name, abbr) {
            const bible = bibleList.find(b => b.name === name);
            document.getElementById('bibleRenameForm').style.display = '';
            document.getElementById('editBibleName').value = name;
            document.getElementById('editBibleOldName').value = name;
            document.getElementById('editBibleAbbr').value = abbr || '';
            document.getElementById('editBibleYear').value = bible && bible.year ? bible.year : '';
            document.getElementById('editBibleFile').value = '';
            document.getElementById('renameMsg').textContent = '';
        };
        window.showDeleteBible = function(name) {
            document.getElementById('deleteBibleModal').style.display = '';
            document.getElementById('deleteBibleName').textContent = name;
            document.getElementById('confirmDeleteBible').setAttribute('data-bible', name);
            document.getElementById('deleteBibleMsg').textContent = '';
        };
        window.downloadBible = function(name) {
            showLoading();
            fetch('/api/download/bible/zip')
                .then(res => {
                    if (!res.ok) {
                        showToast('Download failed: ' + res.status, 'error');
                        hideLoading();
                        return Promise.reject();
                    }
                    return res.blob();
                })
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'bible_all.zip';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    showToast('Download started!', 'success');
                    hideLoading();
                })
                .catch(() => {
                    hideLoading();
                    showToast('Download error.', 'error');
                });
        };
        window.downloadAllBibles = function() {
            showLoading();
            fetch('/api/download/bible/zip')
                .then(res => {
                    if (!res.ok) {
                        showToast('Download failed: ' + res.status, 'error');
                        hideLoading();
                        return Promise.reject();
                    }
                    return res.blob();
                })
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'bible_all.zip';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    showToast('All Bibles downloaded!', 'success');
                    hideLoading();
                })
                .catch(() => {
                    hideLoading();
                    showToast('Download error.', 'error');
                });
        };
        document.getElementById('cancelDeleteBible').onclick = function() {
            document.getElementById('deleteBibleModal').style.display = 'none';
            document.getElementById('deleteBibleMsg').textContent = '';
        };
        document.getElementById('confirmDeleteBible').onclick = function() {
            const name = this.getAttribute('data-bible');
            fetch('/api/delete-bible', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast('Bible deleted!', 'success');
                    setTimeout(() => {
                        document.getElementById('deleteBibleModal').style.display = 'none';
                        fetchBibles();
                    }, 700);
                } else {
                    showToast(result.error || 'Delete failed.', 'error');
                }
            })
            .catch(() => {
                hideLoading();
            })
            .finally(() => {
                hideLoading();
            });
        };
        document.getElementById('cancelEditBible').onclick = function() {
            document.getElementById('bibleRenameForm').style.display = 'none';
            document.getElementById('renameMsg').textContent = '';
        };
        document.getElementById('bibleRenameForm').onsubmit = function(e) {
            e.preventDefault();
            showLoading();
            const oldName = document.getElementById('editBibleOldName').value;
            const newName = document.getElementById('editBibleName').value.trim();
            const newAbbr = document.getElementById('editBibleAbbr').value.trim();
            const newYear = document.getElementById('editBibleYear').value.trim();
            const fileInput = document.getElementById('editBibleFile');
            const file = fileInput.files[0];
            if (!newName) {
                showToast('Bible name cannot be empty.', 'error');
                hideLoading();
                return;
            }
            const formData = new FormData();
            formData.append('old_name', oldName);
            formData.append('new_name', newName);
            formData.append('new_abbreviation', newAbbr);
            formData.append('new_year', newYear);
            if (file) formData.append('file', file);
            fetch('/api/update-bible', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    showToast('Bible updated!', 'success');
                    document.getElementById('bibleRenameForm').style.display = 'none';
                    fetchBibles();
                } else {
                    showToast(result.error || 'Update failed.', 'error');
                }
            })
            .catch(() => {
                hideLoading();
            })
            .finally(() => {
                hideLoading();
            });
        };
        fetchUsers();
        fetchBibles();
    });
    </script>
</body>
</html>
